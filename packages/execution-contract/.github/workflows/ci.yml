name: Contract CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Scan
        run: npm audit

      - name: Build and generate types
        run: npm run build

  backward-compatibility:
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout New Contract
        uses: actions/checkout@v3
        with:
          path: new-contract

      - name: Checkout Old SDK (main branch)
        uses: actions/checkout@v3
        with:
          repository: your-org/execution-sdk
          ref: main
          path: old-sdk

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build New Contract
        run: |
          cd new-contract
          npm ci
          npm run build

      - name: Verify Old SDK works with New Contract
        run: |
          cd old-sdk
          npm ci
          npm install ../new-contract
          npx tsc --noEmit

  forward-compatibility:
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Old Contract (main branch)
        uses: actions/checkout@v3
        with:
          ref: main
          path: old-contract

      - name: Checkout New SDK (if part of PR, else main)
        uses: actions/checkout@v3
        with:
          repository: your-org/execution-sdk
          path: new-sdk

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Old Contract
        run: |
          cd old-contract
          npm ci
          npm run build

      - name: Verify New SDK works with Old Contract
        run: |
          cd new-sdk
          npm ci
          npm install ../old-contract
          npx tsc --noEmit

  trigger-system-tests:
    needs: [backward-compatibility, forward-compatibility]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger System Tests
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: your-org/system-tests
          event-type: contract-updated
