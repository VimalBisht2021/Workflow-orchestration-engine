name: System Tests

on:
  repository_dispatch:
    types:
      - woe-updated
      - dtp-updated
      - sdk-updated
      - contract-updated
  workflow_dispatch: # allow manual triggering

env:
  REGISTRY: ghcr.io

jobs:
  e2e-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull Latest Docker Images
        run: docker compose pull

      - name: Boot Platform (docker compose up)
        run: docker compose up -d

      - name: Wait for Platform Health
        run: |
          echo "Waiting for services to become healthy..."
          until [ "`docker inspect -f {{.State.Health.Status}} $(docker compose ps -q postgres)`" == "healthy" ]; do
              sleep 2;
          done
          until [ "`docker inspect -f {{.State.Health.Status}} $(docker compose ps -q redis)`" == "healthy" ]; do
              sleep 2;
          done
          sleep 5

      - name: Run Component Tests (Layer 1)
        run: npm run test:component

      - name: Run System Tests (Layer 2)
        run: npm run test:system

      - name: Run Performance Benchmarks (Phase 3B)
        run: npm run test:performance

      - name: Upload Docker Compose Logs
        if: failure()
        run: docker compose logs > docker-compose.log

      - name: Archive Docker Logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: docker-logs
          path: docker-compose.log

      - name: Shutdown Platform
        if: always()
        run: docker compose down -v
