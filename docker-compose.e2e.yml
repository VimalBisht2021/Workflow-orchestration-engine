version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  woe-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/workflow_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DTP_BASE_URL=http://dtp-api:4000
      - DTP_API_KEY=dtp-test-key
      - WEBHOOK_SECRET=shared-secret-123
      - WOE_WEBHOOK_URL=http://woe-api:3000/api/webhooks/tasks/events
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: always
    ports:
      - '3001:3000'
    depends_on:
      - woe-api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000

  dtp-api:
    build:
      context: ../distributed-task-platform
      dockerfile: services/api-service/Dockerfile
      additional_contexts:
        execution_contract_pkg: ./packages/execution-contract
    restart: always
    ports:
      - '4001:4000'
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - API_KEY=dtp-test-key
      - WEBHOOK_SECRET=shared-secret-123
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/task_platform?schema=public
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  dtp-worker:
    build:
      context: ../distributed-task-platform
      dockerfile: services/worker-service/Dockerfile
    restart: always
    depends_on:
      - redis
      - dtp-api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_URL=http://dtp-api:4000
      - API_KEY=dtp-test-key
      - WEBHOOK_SECRET=shared-secret-123
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/task_platform?schema=public
      - SSRF_ALLOWED_HOSTS=echo
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  dtp-scheduler:
    build:
      context: ../distributed-task-platform
      dockerfile: services/scheduler-service/Dockerfile
    restart: always
    deploy:
      replicas: 3
    depends_on:
      - redis
      - dtp-api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/task_platform?schema=public
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  dtp-dashboard:
    build:
      context: ../distributed-task-platform
      dockerfile: apps/dashboard/Dockerfile
      additional_contexts:
        builder_pkg: ./packages/builder
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
        NEXT_PUBLIC_LAB_SERVICE_URL: http://localhost:3006
    restart: always
    ports:
      - '4002:3001'
    depends_on:
      - dtp-api

  echo:
    image: mendhak/http-https-echo:34
    restart: always
    ports:
      - '8080:8080'

  lab-service:
    build:
      context: ../distributed-task-platform
      dockerfile: services/lab-service/Dockerfile
    restart: always
    ports:
      - '3006:3006'
    depends_on:
      - dtp-api
      - redis
    environment:
      - PORT=3006
      - API_URL=http://dtp-api:4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  redis_data:
